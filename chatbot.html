<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2563eb">
<title>Ablauf-Assistent – deaktiviert</title>
<style>
:root{--bg:#eaeff7;--bg2:#e3e9f4;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#e5eaf1;--brand:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f1c;--bg2:#0d1424;--card:#151d2e;--text:#e8edf7;--muted:#93a1b8;--border:#28324a;--brand:#60a5fa}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);
 background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%)}
.card{background:var(--card);max-width:440px;width:100%;border:1px solid var(--border);border-radius:20px;
 padding:34px 28px;text-align:center;box-shadow:0 16px 44px rgba(15,23,42,.16)}
.ic{font-size:46px;line-height:1}
h1{font-size:20px;font-weight:750;margin:16px 0 8px;letter-spacing:-.01em}
p{color:var(--muted);font-size:14.5px;line-height:1.55;margin:8px 0}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
<div class="ic">🔌</div>
<h1>Ablauf-Assistent vorübergehend deaktiviert</h1>
<p>Der Assistent steht derzeit nicht zur Verfügung.</p>
<p>Bei Fragen wende dich bitte an den zuständigen Ansprechpartner.</p>
<div class="foot">Bot &amp; Software © 2026 Karl Opelt</div>
</div>
<script>
/* Service Worker abmelden und alle Caches leeren, damit auch installierte /
   offline zwischengespeicherte Versionen auf dem Gerät deaktiviert werden. */
try{if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){try{r.unregister();}catch(e){}});}).catch(function(){});}}catch(e){}
try{if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){try{caches.delete(k);}catch(e){}});}).catch(function(){});}}catch(e){}
</script>
</body>
</html>
